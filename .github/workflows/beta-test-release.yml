name: Build private test beta

# Manual only -- GitHub restricts who can trigger workflow_dispatch to
# accounts with write access to this repo, so as long as no other
# collaborators are added, only the owner can run this. The release it
# creates is also a draft, which GitHub hides from everyone except
# accounts with write access, and from public release feeds/tools (like
# Obtainium) that only ever see published releases. That combination is
# what keeps these test builds private -- there is no "release visible
# only to one specific GitHub account" primitive beyond that.
on:
  workflow_dispatch:
    inputs:
      label:
        description: "Optional note describing what this test build is for"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set version
        id: version
        run: |
          # Offset well clear of the public release track's versionCode
          # (github.run_number is per-workflow, so without this a test
          # build could get a lower versionCode than the public release
          # already installed, and Android refuses to "update" to a lower
          # versionCode).
          echo "code=$(( 100000 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"
          echo "name=1.0.0-test.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             dist/GBAPal-v${{ steps.version.outputs.name }}.apk

      - name: Create draft GitHub release (hidden from the public)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: "GBA Pal v${{ steps.version.outputs.name }} -- private test build: ${{ github.event.inputs.label }}"
          body: |
            Private test build, not for distribution. Triggered manually,
            kept as a draft release so it stays off the public releases page.
          draft: true
          prerelease: true
          make_latest: false
          files: dist/*.apk
